apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fast-translit-ingress
  namespace: fast-translit-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set to true for production with TLS
spec:
  rules:
  - host: api.fasttranslit.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fast-translit-service
            port:
              number: 80
